name: Release — Android app + deploy

# Runs when a version tag is pushed — `npm run release:patch && git push --follow-tags` — or by hand
# from the Actions tab with a tag:
#   1. checks the web build and builds the signed Android APK,
#   2. copies trippin.apk + trippin-apk.json (version info the app checks for updates) to the server's
#      apps/frontend/public, so they're served at <website>/trippin.apk,
#   3. SSHes in, checks out the release, installs, builds and reloads PM2 (scripts/deploy.sh).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag to release (e.g. v1.2.3)
        required: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REF: ${{ github.event.inputs.ref || github.ref_name }}

jobs:
  web:
    name: Build check (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Catches type and bundling errors before anything touches the server.
      - run: npm run build

  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ vars.FLUTTER_VERSION || '3.47.2' }}
          cache: true

      - name: App settings (.env baked into the APK)
        # The public HTTPS addresses since the move to trip-pin.duckdns.org and
        # one sign-in. The old MOBILE_API_BASE_URL / MOBILE_WEB_URL variables
        # still point at plain http on the bare IP, so they're not read here;
        # MOBILE_OIDC_ISSUER overrides the identity server if it's ever set.
        env:
          API_BASE_URL: https://trip-pin.duckdns.org:50008/api/v1
          WEB_URL: https://trip-pin.duckdns.org:50009
          MAP_TILE_URL: ${{ vars.MOBILE_MAP_TILE_URL }}
          OIDC_ISSUER: ${{ vars.MOBILE_OIDC_ISSUER || 'https://pass-port.duckdns.org:50011' }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Set the MOBILE_API_BASE_URL repository variable (e.g. https://<name>.duckdns.org:<PORT>/api/v1)."
            exit 1
          fi
          if [ -z "$OIDC_ISSUER" ]; then
            echo "::error::Set the MOBILE_OIDC_ISSUER repository variable — the identity server the app signs in with (e.g. https://id-x.duckdns.org:50011)."
            exit 1
          fi
          {
            echo "API_BASE_URL=$API_BASE_URL"
            echo "OIDC_ISSUER=$OIDC_ISSUER"
            if [ -n "$WEB_URL" ]; then echo "WEB_URL=$WEB_URL"; fi
            if [ -n "$MAP_TILE_URL" ]; then echo "MAP_TILE_URL=$MAP_TILE_URL"; fi
          } > .env

      - name: Firebase config (push notifications)
        # Optional: the GOOGLE_SERVICES_JSON secret (the file from the Firebase console, as JSON or
        # base64). Without it the APK builds and runs without push notifications.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret: building without push notifications."
            exit 0
          fi
          case "$GOOGLE_SERVICES_JSON" in
            \{*) printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json ;;
            *) printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json ;;
          esac
          echo "google-services.json written ($(wc -c < android/app/google-services.json) bytes)."

      - name: Signing key
        # Every release must be signed with the same key, or phones refuse to install the update.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD secrets (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        # Version name from the tag (v1.2.3 → 1.2.3); the build number only ever goes up, which is what
        # the app compares to offer an update.
        run: |
          NAME="${REF#v}"
          flutter build apk --release --build-name "$NAME" --build-number "${{ github.run_number }}"
          mkdir -p ../../release
          cp build/app/outputs/flutter-apk/app-release.apk ../../release/trippin.apk

      - name: Version file for in-app updates
        # notes: the tag's annotation, if the tag has one (release-it writes "Release v1.2.3" — skipped).
        run: |
          NOTES="$(git tag -l --format='%(contents:subject)' "$REF" 2>/dev/null || true)"
          case "$NOTES" in Release*|"") NOTES="";; esac
          jq -n \
            --arg version "${REF#v}" \
            --argjson buildNumber "${{ github.run_number }}" \
            --arg url "trippin.apk" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "${NOTES:-}" \
            '{version: $version, buildNumber: $buildNumber, url: $url, releasedAt: $releasedAt, notes: $notes}' \
            > ../../release/trippin-apk.json
          cat ../../release/trippin-apk.json

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: release/
          retention-days: 14

  deploy:
    name: Deploy to the server
    needs: [web, apk]
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_DIR: ${{ vars.VPS_APP_DIR || secrets.VPS_APP_DIR || '/opt/var/trippin' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: release

      - name: Copy the APK to apps/frontend/public
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          source: release/trippin.apk,release/trippin-apk.json
          target: ${{ env.APP_DIR }}/apps/frontend/public
          strip_components: 1
          overwrite: true

      - name: Update the code, build and reload PM2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ env.REF }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT || 22 }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          envs: DEPLOY_REF,APP_DIR
          command_timeout: 20m
          script: |
            # A non-interactive SSH shell doesn't read ~/.bashrc, so nvm (and node, npm, pm2) isn't
            # loaded. Load it before `set -e` — nvm's own scripts return non-zero in normal use.
            export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "nvm not found at $NVM_DIR/nvm.sh — set NVM_DIR or install nvm" >&2
              exit 1
            fi
            cd "$APP_DIR" || { echo "No checkout at $APP_DIR" >&2; exit 1; }
            # The Node version the repo asks for (.nvmrc); installed the first time it's needed.
            nvm install >/dev/null && nvm use || { echo "nvm couldn't switch to the version in .nvmrc" >&2; exit 1; }
            set -e
            echo "Using node $(node -v), npm $(npm -v) from $(command -v node)"
            # The release's code: fetch and check out its tag (the APK above is git-ignored, so it stays).
            git fetch --tags --force origin
            git checkout --force --detach "$DEPLOY_REF"
            # npm ci → npm run build (the frontend build copies public/trippin.apk into dist) → pm2 reload → health check
            bash scripts/deploy.sh "$DEPLOY_REF"
            ls -la apps/frontend/dist/trippin.apk apps/frontend/dist/trippin-apk.json
