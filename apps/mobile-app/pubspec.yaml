name: itinerary_planner
description: Trippin — your saved trip plans, maps and directions, offline
publish_to: 'none'
version: 0.2.9+11

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.1.1
  flutter_map_tile_caching: ^10.0.0
  latlong2: ^0.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.5.2
  package_info_plus: ^9.0.1
  flutter_appauth: ^12.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/brand/logo.png

  # IBM Plex (SIL Open Font License 1.1 — see assets/fonts/OFL.txt), bundled so the app looks
  # right offline.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

