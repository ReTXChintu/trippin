name: itinerary_planner
description: Trippin — your saved trip plans, maps and directions, offline
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_secure_storage: ^9.2.4
  flutter_map: ^8.1.1
  flutter_map_tile_caching: ^10.0.0
  latlong2: ^0.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.1
  flutter_dotenv: ^5.2.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.3
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.5.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:

  uses-material-design: true

  assets:
    - .env
    - assets/brand/logo.png

